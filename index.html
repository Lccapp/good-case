<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>選好價｜跨通路商品比價</title>
  <style>
    :root { --ink:#3f4543; --muted:#7d8580; --paper:#f7f4ef; --surface:#fffdfa; --sage:#9eada1; --sage-deep:#617567; --rose:#c58d91; --line:#e5dfd6; --shadow:0 12px 34px rgba(76,65,52,.09); }
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}.shell{max-width:1180px;margin:auto;padding:28px 24px 70px}
    header{display:flex;justify-content:space-between;align-items:center;padding:7px 0 30px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.08em}.brand-mark{width:34px;height:34px;border-radius:50% 50% 45% 50%;background:var(--sage-deep);position:relative}.brand-mark:after{content:"";position:absolute;width:10px;height:16px;border:2px solid #f7f4ef;border-top:0;border-left:0;transform:rotate(42deg);left:10px;top:6px}.header-note{font-size:13px;color:var(--muted);letter-spacing:.04em}
    .hero{background:#e8e1d6;border-radius:26px;padding:42px 46px 38px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:#d7dfd5;right:-88px;top:-145px}.eyebrow{color:var(--sage-deep);font-size:13px;letter-spacing:.12em;font-weight:700}.hero h1{margin:8px 0 11px;font-size:clamp(30px,5vw,48px);letter-spacing:.04em;font-weight:600;line-height:1.22}.hero p{margin:0 0 27px;color:#626762;font-size:16px}.search{max-width:680px;background:var(--surface);height:58px;border-radius:15px;display:flex;align-items:center;padding:6px 6px 6px 19px;box-shadow:0 5px 16px rgba(90,74,54,.09);position:relative;z-index:1}.search svg{width:21px;margin-right:11px;color:var(--muted)}.search input{border:0;outline:0;background:transparent;font:inherit;flex:1;min-width:0;color:var(--ink)}.search button{height:46px;border:0;border-radius:11px;background:var(--sage-deep);color:#fff;padding:0 23px;font:inherit;cursor:pointer}.search button:hover{background:#526657}.hint{font-size:12px;color:#747a75;margin:10px 0 0 3px;position:relative;z-index:1}
    .toolbar{display:flex;justify-content:space-between;align-items:end;margin:41px 2px 20px;gap:16px}.toolbar h2{font-size:20px;margin:0;font-weight:600}.toolbar p{margin:3px 0 0;color:var(--muted);font-size:13px}.sorts{display:flex;gap:8px}.sort{border:1px solid #cfc9c0;background:transparent;border-radius:999px;padding:8px 15px;color:#626862;font:inherit;font-size:13px;cursor:pointer}.sort.active{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff}
    .channel{margin:18px 0 28px}.channel-title{display:flex;align-items:center;gap:12px;margin-bottom:11px}.channel-title:after{content:"";height:1px;background:var(--line);flex:1}.channel-logo{font-weight:800;font-size:20px;letter-spacing:-.06em;min-width:76px;display:flex;align-items:center}.channel-logo img{display:block;max-width:150px;height:30px;object-fit:contain;object-position:left center}.channel-logo a{display:flex;align-items:center}.channel-logo a:focus-visible{outline:2px solid var(--channel);outline-offset:4px}.channel-sub{font-size:12px;color:var(--muted);letter-spacing:.05em}.momo .channel-logo{color:#ea27c2}.pchome .channel-logo{color:#df2028}.coupang .channel-logo{color:#1675c1}.yahoo .channel-logo{color:#907cff}.amazon .channel-logo{color:#252f3e}
    .products{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.product-link{display:block;color:inherit;text-decoration:none;min-width:0}.product{background:var(--surface);border:2px solid var(--channel);border-radius:15px;padding:14px;position:relative;min-height:246px;box-shadow:0 4px 12px rgba(76,65,52,.035);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}.product-link:hover .product{transform:translateY(-3px);box-shadow:var(--shadow)}.product-link:focus-visible{outline:2px solid var(--channel);outline-offset:3px;border-radius:16px}.momo{--channel:#ea27c2}.pchome{--channel:#df2028}.coupang{--channel:#1675c1}.yahoo{--channel:#907cff}.amazon{--channel:#ff9900}.more-row{display:flex;justify-content:flex-end;align-items:flex-end;margin-top:13px}.more-link{color:var(--channel);font-size:13px;font-weight:600;text-decoration:none;padding:7px 2px;display:inline-flex;align-items:flex-end;line-height:1.35}.more-ellipsis{display:inline-block;line-height:1;transform:translateY(.08em)}.more-link:hover{text-decoration:underline}.badge{position:absolute;right:11px;top:10px;font-size:19px}.badge.star,.legend .star-legend{color:#ffba25;text-shadow:0 0 2px rgba(255,250,220,.9),0 0 6px rgba(255,208,104,.42),0 0 11px rgba(255,222,150,.26);filter:drop-shadow(0 1px 1px rgba(136,90,0,.16))}.badge.crown{filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))}.item-type{font-size:11px;color:var(--muted);letter-spacing:.07em;margin-bottom:8px}.product-title{--title-lh:1.45;--title-lines:3;font-size:14px;line-height:var(--title-lh);height:calc(var(--title-lh) * var(--title-lines) * 1em);margin:0 14px 11px 0;position:relative;overflow:hidden;flex-shrink:0}.product-title h3{font-size:inherit;line-height:inherit;font-weight:600;margin:0;word-break:break-word}.product-title.is-clamped::after{content:'...';position:absolute;right:0;bottom:0;padding-left:.75em;background:linear-gradient(to right,transparent 0%,var(--surface) 60%,var(--surface) 100%);line-height:var(--title-lh)}.price{font-size:22px;font-weight:700;letter-spacing:-.03em;color:#343a36;margin-top:auto}.price small{font-size:12px;font-weight:500;letter-spacing:0;margin-right:2px}.deal{margin-top:9px;min-height:48px;background:#f0ece5;border-radius:8px;padding:7px 8px;font-size:12px;color:#5b625e;line-height:1.45}.points{display:flex;gap:7px;align-items:center;color:var(--sage-deep);font-size:12px;margin-top:9px}.points:before{content:"＋";display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:#dce6dc;font-weight:700}.recommend .deal{background:#f2e6e4;color:#8e5d61}.recommend .points:before{background:#ede1c9;color:#83682c}.empty{display:none;color:var(--muted);text-align:center;padding:38px}.loading{color:var(--sage-deep);text-align:center;padding:28px;font-size:14px}.loading[hidden]{display:none}.status-pill{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;vertical-align:middle}.status-pill.live{background:#dce6dc;color:#3f5f49}.status-pill.mock{background:#f0ece5;color:#7d6a52}
    .footnote{border-top:1px solid var(--line);padding-top:18px;margin-top:40px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}.legend{display:flex;gap:15px;white-space:nowrap}.legend b{font-weight:500;color:var(--ink)}
    @media(max-width:1040px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.product{min-height:238px}.product-title{font-size:15px}.price{font-size:25px}.deal{min-height:38px}}
    @media(max-width:780px){.shell{padding:20px 16px 45px}.hero{padding:31px 24px 26px;border-radius:20px}.hero:after{width:180px;height:180px;right:-75px;top:-105px}.products{grid-template-columns:1fr 1fr}.toolbar{align-items:flex-start;flex-direction:column;margin-top:31px}.footnote{flex-direction:column}.header-note{display:none}}
    @media(max-width:480px){.products{grid-template-columns:1fr}.search{height:54px;padding-left:13px}.search button{padding:0 14px}.hero h1{font-size:30px}.sort{padding:7px 12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><span class="brand-mark"></span>選好價</div><div class="header-note">五大通路・一次比較</div></header>
    <section class="hero"><div class="eyebrow">SMART SHOPPING, SIMPLIFIED</div><h1>找出價格，也找出更好的選擇。</h1><p>比較售價、折扣、回饋點數與贈品，安心選擇最適合你的購物通路。</p><form class="search" id="searchForm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="query" aria-label="搜尋商品" value="AirPods Pro 第 2 代" placeholder="輸入想比較的商品"><button type="submit">開始比價</button></form><div class="hint">試試搜尋：AirPods Pro 第 2 代、Sony WH-1000XM5、Switch 2</div></section>
    <section class="toolbar"><div><h2 id="resultTitle">「AirPods Pro 第 2 代」比價結果</h2><p id="resultInfo">共找到 12 項商品・價格已含可見折扣</p><p class="status" id="dataStatus"></p></div><div class="sorts" aria-label="排序方式"><button class="sort active" data-sort="default">預設排序</button><button class="sort" data-sort="price">價格排序</button><button class="sort" data-sort="score">綜合推薦排序</button></div></section>
    <div class="loading" id="loading" hidden>正在向各通路查詢最新價格…</div>
    <div id="results"></div><div class="empty" id="empty">找不到相符的商品，請換個關鍵字試試。</div>
    <footer class="footnote"><span>價格與優惠資訊為示範資料；結帳前請以各通路頁面為準。</span><span class="legend"><b class="star-legend">★</b> 最低價　 <b>👑</b> 綜合最佳推薦</span></footer>
  </main>
  <script src="config.js"></script>
  <script>
    function getApiBase(){
      if(window.API_URL) return String(window.API_URL).replace(/\/$/,'');
      const host=window.location.hostname;
      if(host==='localhost'||host==='127.0.0.1'||window.location.protocol==='file:') return 'http://localhost:3000';
      if(host.endsWith('github.io')) return '';
      return window.location.origin;
    }
    const API_BASE=getApiBase();
    let channels=[];
    let meta={ pchomeLive:false, pchomeError:null };
    let mode='default';
    let query='AirPods Pro 第 2 代';
    let loading=false;
    function homeUrl(c){return {momo:'https://www.momoshop.com.tw/',pchome:'https://24h.pchome.com.tw/',coupang:'https://www.tw.coupang.com/',yahoo:'https://tw.buy.yahoo.com/',amazon:'https://www.amazon.co.jp/'}[c.id]}
    function logo(c){const image={momo:'momo-logo.png',pchome:'pchome-logo.png',coupang:'coupang-logo.png',yahoo:'yahoo-logo.png',amazon:'amazon-logo.png'}[c.id];return `<a href="${homeUrl(c)}" target="_blank" rel="noopener noreferrer" aria-label="前往 ${c.name} 首頁"><img src="${image}" alt="${c.name}"></a>`}
    function searchUrl(c,q){const term=encodeURIComponent(q||'AirPods Pro 第 2 代');return {momo:`https://www.momoshop.com.tw/search/searchShop.jsp?keyword=${term}`,pchome:`https://ecshweb.pchome.com.tw/search/v3.3/?q=${term}`,coupang:`https://www.tw.coupang.com/np/search?q=${term}`,yahoo:`https://tw.buy.yahoo.com/search/product?p=${term}`,amazon:`https://www.amazon.co.jp/s?k=${term}`}[c.id]}
    function productUrl(c,x){return x.url||searchUrl(c,x.title)}
    function sourceBadge(c){if(c.id!=='pchome')return '';if(c.source==='live')return '<span class="status-pill live">即時資料</span>';return '<span class="status-pill mock">示範資料</span>'}
    function setLoading(isLoading){loading=isLoading;document.getElementById('loading').hidden=!isLoading;document.getElementById('results').hidden=isLoading;document.getElementById('empty').hidden=true}
    async function fetchProducts(keyword){if(!API_BASE)throw new Error('請在 config.js 設定 window.API_URL（雲端後端網址）');const res=await fetch(`${API_BASE}/api/products?q=${encodeURIComponent(keyword)}`);if(!res.ok)throw new Error('後端 API 回應失敗');return res.json()}
    async function loadProducts(keyword){query=keyword.trim();document.getElementById('resultTitle').textContent=`「${query||'全部商品'}」比價結果`;setLoading(true);try{const data=await fetchProducts(query||'AirPods');channels=data.channels||[];meta=data.meta||{};render()}catch(error){channels=[];meta={ pchomeLive:false, pchomeError:error.message };document.getElementById('results').innerHTML='';document.getElementById('empty').hidden=false;document.getElementById('empty').textContent=`無法取得比價資料：${error.message}`;document.getElementById('resultInfo').textContent='API 連線失敗'}finally{setLoading(false)}}
    function markClampedTitles(){document.querySelectorAll('.product-title').forEach(w=>{const h3=w.querySelector('h3');w.classList.toggle('is-clamped',h3.scrollHeight>w.clientHeight+1)})}
    function render(){const root=document.getElementById('results');root.hidden=false;const q=query.trim().toLowerCase();const matches=c=>c.items.filter(x=>!q||x.title.toLowerCase().includes(q)||c.name.toLowerCase().includes(q));const all=channels.flatMap(c=>matches(c).map(x=>({...x,c})));if(!all.length){root.innerHTML='';document.getElementById('empty').hidden=false;document.getElementById('resultInfo').textContent='未找到相符商品';return}const cheapest=all.reduce((a,b)=>a.price<b.price?a:b);const best=all.reduce((a,b)=>a.score>b.score?a:b);const orderIndex=c=>channels.indexOf(c);const orderedChannels=[...channels].sort((a,b)=>{if(mode==='default')return orderIndex(a)-orderIndex(b);const aItems=matches(a),bItems=matches(b);if(mode==='price'){const comparison=(aItems.length?Math.min(...aItems.map(x=>x.price)):Infinity)-(bItems.length?Math.min(...bItems.map(x=>x.price)):Infinity);return comparison||orderIndex(a)-orderIndex(b)}const comparison=(bItems.length?Math.max(...bItems.map(x=>x.score)):-Infinity)-(aItems.length?Math.max(...aItems.map(x=>x.score)):-Infinity);return comparison||orderIndex(a)-orderIndex(b)});root.innerHTML=orderedChannels.map(c=>{let items=matches(c);if(!items.length)return '';items=[...items].sort((a,b)=>mode==='score'?(b.score-a.score||a.price-b.price):a.price-b.price);const visible=items.slice(0,6);const buttonText=items.length>6?`更多<span class="more-ellipsis">...</span> 前往 ${c.name} 搜尋`:`前往 ${c.name} 搜尋`;const more=`<div class="more-row"><a class="more-link" href="${searchUrl(c,query)}" target="_blank" rel="noopener noreferrer">${buttonText}</a></div>`;return `<section class="channel ${c.id}"><div class="channel-title"><div class="channel-logo">${logo(c)}</div><span class="channel-sub">${c.name}${sourceBadge(c)}</span></div><div class="products">${visible.map(x=>{const isCheapest=c.id===cheapest.c.id&&x.title===cheapest.title&&x.price===cheapest.price;const isBest=c.id===best.c.id&&x.title===best.title&&x.score===best.score;const mark=isCheapest?'★':isBest?'👑':'';const markClass=isCheapest?'star':isBest?'crown':'';return `<a class="product-link" href="${productUrl(c,x)}" target="_blank" rel="noopener noreferrer" aria-label="前往 ${c.name} 查看 ${x.title}"><article class="product ${isBest?'recommend':''}"><span class="badge ${markClass}" aria-label="${isCheapest?'全站最低價':isBest?'綜合最佳推薦':''}">${mark}</span><div class="item-type">${c.source==='live'?'即時比價':'示範資料'}</div><div class="product-title"><h3>${x.title}</h3></div><div class="price"><small>NT$</small>${x.price.toLocaleString()}</div><div class="deal">${x.deal||'—'}</div><div class="points">${x.points||'—'}</div></article></a>`}).join('')}</div>${more}</section>`}).join('');document.getElementById('empty').hidden=true;const liveNote=meta.pchomeLive?'PChome 為即時資料':meta.pchomeError?`PChome 暫用示範資料（${meta.pchomeError}）`:'PChome 為示範資料';document.getElementById('resultInfo').textContent=`共找到 ${all.length} 項商品・每通路最多顯示 6 項・${liveNote}`;markClampedTitles();}
    document.querySelectorAll('.sort').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.sort;document.querySelectorAll('.sort').forEach(x=>x.classList.toggle('active',x===b));render()}));
    document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();loadProducts(document.getElementById('query').value)});
    loadProducts(document.getElementById('query').value);
  </script>
</body>
</html>
